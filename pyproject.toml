[project]
name = "productionrag"
version = "0.1.0"
description = "Grounded document question answering with hybrid retrieval, an agentic correction loop and a production API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "langchain>=1.3.2",
    "langchain-anthropic>=1.4.4",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.0",
    "langchain-openai>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.2",
    "llama-cpp-python==0.3.35",
    "pydantic-settings>=2.14.1",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.13.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
rag = "rag.cli:main"

# llama-cpp-python: use the project's prebuilt CPU wheels instead of compiling from source.
[[tool.uv.index]]
name = "llama-cpp-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

[tool.uv.sources]
llama-cpp-python = { index = "llama-cpp-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pyarrow>=26.0.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
